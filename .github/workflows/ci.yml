name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # Necessário só para o build não falhar; nenhuma página ainda consulta o
          # banco durante o build. Atualize com secrets reais quando isso mudar.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

# E2E (Playwright) roda só manualmente/local (`npm run test:e2e`) — tirado do
# CI porque instalar o Chromium a cada push consumia muita cota do GitHub
# Actions. Lint/unit tests/build continuam automáticos aqui porque são
# rápidos e baratos; a rede de segurança extra fica no pre-commit/pre-push
# (ver .husky/).
